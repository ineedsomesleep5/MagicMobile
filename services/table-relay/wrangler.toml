# MagicMobile table relay: passes messages between the phones at one table.
# The host's phone runs the rules engine; this service never sees a hand it was not sent
# and keeps nothing after a table ends.
name = "magicmobile-relay"
main = "src/index.js"
compatibility_date = "2025-09-15"
workers_dev = true

[[durable_objects.bindings]]
name = "TABLES"
class_name = "TableRoom"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableRoom"]

# POST /v1/tables: at most 5 new tables a minute per caller (an IPv4 address or an IPv6 /64),
# counted at each Cloudflare location. Over the limit the relay answers 429 `rate_limited`.
# The relay opens tables without a limit if this binding is missing.
[[ratelimits]]
name = "TABLE_CREATES"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = false
