name: MagicMobileiOS
options:
  bundleIdPrefix: com.calebfeliciano
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 82HPAY85M8
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2026091301"
    MM_ENGINE_MODE: "unlinked-reference"
packages:
  OnDeviceCore:
    path: ../../packages/ondevice-engine/swift
targets:
  MagicMobile:
    type: application
    platform: iOS
    sources:
      - path: MagicMobile
    dependencies:
      - package: OnDeviceCore
        product: MagicMobileOnDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calebfeliciano.magicmobile
        PRODUCT_NAME: MagicMobile
        INFOPLIST_FILE: MagicMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: MagicMobile/MagicMobile.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  MagicMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MagicMobileTests
        excludes:
          - Fixtures
      - path: MagicMobileTests/Fixtures/OnDevice
        type: folder
        buildPhase: resources
    dependencies:
      - target: MagicMobile
  MagicMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MagicMobileUITests
    dependencies:
      - target: MagicMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MagicMobile:
    build:
      targets:
        MagicMobile: all
    test:
      targets:
        - MagicMobileTests
        - MagicMobileUITests
