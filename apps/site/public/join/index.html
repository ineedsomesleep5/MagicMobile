<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090c">
  <title>Join a MagicMobile table</title>
  <meta property="og:title" content="Join my MagicMobile table">
  <meta property="og:description" content="Tap to join a Commander table in MagicMobile on iPhone or Android.">
  <meta property="og:image" content="https://magicmobile-downloads.vercel.app/social.jpg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    /* Arena, as on the download site (see ../../DESIGN.md): a glass plate, Arena's orange and glass pills. */
    :root { color-scheme: dark; --canvas: #0c0d11; --ink: #f2ebdb; --soft: #c2b8a6; --gold: #fad685; --hair: rgba(232, 190, 112, 0.55);
      --serif: "Iowan Old Style", "Source Serif 4", Georgia, serif; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
      background: radial-gradient(90% 60% at 50% 110%, rgba(244, 122, 28, 0.18), transparent 70%), radial-gradient(70% 40% at 50% 0%, #2a1a10, transparent 70%), var(--canvas);
      color: var(--ink); font: 17px/1.5 var(--sans); }
    main { width: 100%; max-width: 420px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 20px; margin: 0 auto; box-shadow: 0 0 0 1px var(--hair), 0 10px 24px rgba(0, 0, 0, 0.6); }
    h1 { font: 800 28px/1.2 var(--serif); margin: 18px 0 6px; }
    p { color: var(--soft); margin: 0 0 18px; }
    .code { font: 800 38px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 4px; margin: 10px 0 22px; color: var(--ink);
      background: linear-gradient(rgba(26, 28, 36, 0.92), rgba(10, 11, 15, 0.95)); border: 1px solid var(--hair); border-radius: 14px; padding: 18px 8px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06); }
    a.button { display: flex; align-items: center; justify-content: center; min-height: 54px; text-decoration: none; border-radius: 999px; padding: 0 20px; margin: 12px 0;
      font: 700 19px/1 var(--serif); color: #fff; }
    .primary { text-shadow: 0 1px 1.5px rgba(89, 26, 0, 0.75); background: linear-gradient(transparent 50%, rgba(110, 20, 0, 0.35)), linear-gradient(#ffb24a, #f47a1c 48%, #c9420d);
      border: 1.5px solid rgba(255, 214, 150, 0.9); box-shadow: 0 3px 12px rgba(255, 120, 31, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
    .secondary { color: #f2e8d9; font-weight: 600; background: linear-gradient(rgba(41, 43, 51, 0.92), rgba(20, 22, 26, 0.94)); border: 1px solid rgba(255, 230, 191, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14); }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    small { display: block; color: var(--soft); margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="/app-icon.png" alt="MagicMobile">
    <h1>You're invited to a table</h1>
    <p>Open MagicMobile to join. If it doesn't open, go to Play → Custom → Online table and type this code.</p>
    <div class="code" id="code" aria-label="Table code">——————</div>
    <a class="button primary" id="open" href="/">Open in MagicMobile</a>
    <a class="button secondary" href="/#download">Get MagicMobile</a>
    <small>iPhone and Android can play together. Keep the app open during the match.</small>
  </main>
  <script>
    (function () {
      var alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      var raw = (location.pathname.split("/").filter(Boolean)[1] || "").toUpperCase();
      var valid = raw.length === 6 && raw.split("").every(function (c) { return alphabet.indexOf(c) >= 0; });
      var open = document.getElementById("open");
      if (!valid) {
        document.getElementById("code").textContent = "No code";
        open.style.display = "none";
        return;
      }
      document.getElementById("code").textContent = raw.slice(0, 3) + " " + raw.slice(3);
      var android = /Android/i.test(navigator.userAgent);
      open.href = android
        ? "intent://join/" + raw + "#Intent;scheme=magicmobile;package=com.calebfeliciano.magicmobile.android;S.browser_fallback_url=" +
          encodeURIComponent(location.origin + "/#download") + ";end"
        : "magicmobile://join/" + raw;
    })();
  </script>
</body>
</html>
