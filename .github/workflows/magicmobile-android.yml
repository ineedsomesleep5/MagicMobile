name: Android native development
on:
  workflow_dispatch:
    inputs:
      native_reports:
        description: 'Measurement only: heap histogram, class-init report, per-method code and heap sizes and the analysis call tree (docs/cloud/engine-size.md)'
        type: boolean
        default: false
      optimize:
        description: 'native-image optimization level: 2 (default) or s (size; docs/LIGHTER_ENGINE_PLAN.md step 4)'
        type: choice
        options: ['2', 's']
        default: '2'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-native:
    if: contains(github.event.head_commit.message, '[android-native]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # 17 (listed last) stays the default for Gradle; the engine's JVM steps use 23, the class library
      # the native engine is built with (Gluon GraalVM for JDK 23, native/gluon/toolchain.json).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            23
            17
      # Third-party Maven downloads only: the XMage modules this build installs (org/mage) are
      # rebuilt from the pinned source every run and never restored from the cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/mage
            build_output/android/maven
          key: android-native-maven-${{ runner.os }}-${{ hashFiles('packages/ondevice-engine/upstream.lock.json', 'packages/ondevice-engine/native/gluon/pom.xml') }}
          restore-keys: android-native-maven-${{ runner.os }}-
      - name: Build the full real XMage JVM input
        run: |
          export JAVA_HOME="$JAVA_HOME_23_X64" PATH="$JAVA_HOME_23_X64/bin:$PATH"
          bash packages/ondevice-engine/scripts/build_jvm.sh
      - name: Real XMage JVM regression tests
        run: |
          export JAVA_HOME="$JAVA_HOME_23_X64" PATH="$JAVA_HOME_23_X64/bin:$PATH"
          bash packages/ondevice-engine/scripts/test_real_engine.sh
      - name: Prepare Android build SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Cross-compile full Android ARM64 engine
        # About 20 minutes when healthy; a stalled builder fails early instead of using the job.
        timeout-minutes: 45
        env:
          MM_ANDROID_NATIVE_HEAP: 10g
          MM_NATIVE_REPORTS: ${{ inputs.native_reports && '1' || '0' }}
          MM_NATIVE_OPTIMIZE: ${{ inputs.optimize || '2' }}
        run: |
          set -euo pipefail
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/android/build_native.sh
      # The same breakdown as magicmobile-native-code-sizes.yml, from this run's unstripped library, in the log.
      - name: Code size by package (measurement)
        if: success() && inputs.native_reports
        run: |
          set -euo pipefail
          GRAALVM_HOME=$(cat build_output/android/JAVA_HOME.txt)
          OUT=build_output/android/native-reports
          "$GRAALVM_HOME/bin/jimage" list "$GRAALVM_HOME/lib/modules" | grep '\.class$' | sed 's/^ *//' > "$OUT/jdk-classes.txt"
          tr ':' '\n' < packages/ondevice-engine/build/runtime-classpath.txt | grep '\.jar$' \
            | while read -r jar; do unzip -Z1 "$jar" | grep '\.class$' || true; done > "$OUT/jar-classes.txt"
          python3 packages/ondevice-engine/scripts/native_code_sizes.py build_output/android/unstripped/libmmengine.so \
            --csv "$OUT/code-sizes.csv" --top 60 --sources packages/ondevice-engine --classes "$OUT/jdk-classes.txt" --classes "$OUT/jar-classes.txt" \
            | tee "$OUT/code-sizes.md"
          cat "$OUT/code-sizes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-evidence-${{ github.sha }}
          path: |
            build_output/android/*.log
            build_output/android/*.json
            build_output/android/*.txt
            build_output/android/native-*/gluonfx/**/log/**
            build_output/android/native-*/gluonfx/**/reports/**
            build_output/android/native-reports/**
            build_output/android/native-*/builder-gc.log*
            packages/ondevice-engine/evidence/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-full-native-${{ github.sha }}
          path: apps/android/native-artifact/
          compression-level: 1
          retention-days: 14
          if-no-files-found: error
      # The staged engine is stripped; its unstripped twin (same build, paired by SHA-256 in
      # symbols.json and the manifest) symbolicates native crash stacks.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-native-symbols-${{ github.sha }}
          path: build_output/android/unstripped/
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
      # Gradle comes from the wrapper (apps/android/gradlew, pinned with a checksum).
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the actual native-linked test APK
        run: |
          set -euo pipefail
          apps/android/gradlew -p apps/android --no-daemon -PwithNative=true :core:contractChecks :core:deckStudioChecks :core:providerChecks :core:insightChecks :app:assembleDebug :app:lintDebug
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MagicMobile-Android-NATIVE-APK-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/native-artifact/manifest.json
          retention-days: 14
          if-no-files-found: error
