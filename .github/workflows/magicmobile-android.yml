name: Android native development
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-native:
    if: contains(github.event.head_commit.message, '[android-native]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Third-party Maven downloads only: the XMage modules this build installs (org/mage) are
      # rebuilt from the pinned source every run and never restored from the cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/mage
            build_output/android/maven
          key: android-native-maven-${{ runner.os }}-${{ hashFiles('packages/ondevice-engine/upstream.lock.json', 'packages/ondevice-engine/native/gluon/pom.xml') }}
          restore-keys: android-native-maven-${{ runner.os }}-
      - name: Build the full real XMage JVM input
        run: bash packages/ondevice-engine/scripts/build_jvm.sh
      - name: Real XMage JVM regression tests
        run: bash packages/ondevice-engine/scripts/test_real_engine.sh
      - name: Prepare Android build SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Cross-compile full Android ARM64 engine
        # About 20 minutes when healthy; a stalled builder fails early instead of using the job.
        timeout-minutes: 45
        env:
          MM_ANDROID_NATIVE_HEAP: 10g
          # Host JDK17.0.3 MXBean crashes on newer cgroup layouts. Heap/CPU limits
          # are explicit in the build; this is NOT an Android runtime option.
          JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
        run: |
          set -euo pipefail
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/android/build_native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-evidence-${{ github.sha }}
          path: |
            build_output/android/*.log
            build_output/android/*.json
            build_output/android/*.txt
            build_output/android/native-*/gluonfx/**/log/**
            build_output/android/native-*/builder-gc.log*
            packages/ondevice-engine/evidence/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-full-native-${{ github.sha }}
          path: apps/android/native-artifact/
          compression-level: 1
          retention-days: 14
          if-no-files-found: error
      # The staged engine is stripped; its unstripped twin (same build, paired by SHA-256 in
      # symbols.json and the manifest) symbolicates native crash stacks.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-native-symbols-${{ github.sha }}
          path: build_output/android/unstripped/
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build the actual native-linked test APK
        run: |
          set -euo pipefail
          gradle -p apps/android --no-daemon -PwithNative=true :core:contractChecks :core:deckStudioChecks :core:providerChecks :core:insightChecks :app:assembleDebug :app:lintDebug
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MagicMobile-Android-NATIVE-APK-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/native-artifact/manifest.json
          retention-days: 14
          if-no-files-found: error
