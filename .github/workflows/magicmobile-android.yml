name: Android native development
on:
  push:
    branches: [codex/android-native-xmage]
    paths: ['apps/android/**', 'scripts/android/**', '.github/workflows/magicmobile-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  toolchain-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory official Linux toolchain without executing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_output/android
          URL=https://github.com/gluonhq/graal/releases/download/gluon-22.1.0.1-Final/graalvm-svm-java17-linux-gluon-22.1.0.1-Final.tar.gz
          curl --fail --location --retry 2 --max-time 300 "$URL" -o "$RUNNER_TEMP/gluon-linux.tar.gz"
          test "$(stat -c%s "$RUNNER_TEMP/gluon-linux.tar.gz")" = 387711216
          sha256sum "$RUNNER_TEMP/gluon-linux.tar.gz" | tee build_output/android/toolchain.sha256
          python3 - <<'PY'
          import os, tarfile, json
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'gluon-linux.tar.gz'
          with tarfile.open(p) as t:
              names=[x.name for x in t.getmembers()]
              selected=[n for n in names if n.endswith('/release') or ('/clibraries/' in n and n.endswith('.a'))]
              for n in selected:
                  print(n)
                  if n.endswith('/release'): print(t.extractfile(n).read().decode())
              Path('build_output/android/toolchain-layout.json').write_text(json.dumps(selected,indent=2))
          PY
          git rev-parse HEAD > build_output/android/source.txt
          ls "$ANDROID_HOME/ndk" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-toolchain-inventory-${{ github.sha }}
          path: build_output/android/
          retention-days: 7
          if-no-files-found: error
