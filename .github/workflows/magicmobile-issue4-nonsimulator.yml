name: Issue 4 non-simulator verification

on:
  push:
    branches: [codex/issue-4-native-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue4-nonsimulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue4-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/issue4-source/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/issue4-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/issue4-source/tree.txt"
          sha256sum "$RUNNER_TEMP/issue4-source/source.tar.gz" > "$RUNNER_TEMP/issue4-source/SHA256SUMS"
          echo 'Provenance only; no engine/runtime/device acceptance is implied.' > "$RUNNER_TEMP/issue4-source/SCOPE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: issue4-source-${{ github.sha }}
          path: ${{ runner.temp }}/issue4-source/
          retention-days: 7
          if-no-files-found: error

  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/ondevice-engine
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/test_tooling.sh
      - run: bash scripts/test_native_boundary.sh
      - run: bash scripts/test_far_call_planner.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue4-contracts-${{ github.sha }}
          path: packages/ondevice-engine/evidence/
          retention-days: 7
          if-no-files-found: error

  apple-source-and-sdk:
    runs-on: macos-26-intel
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare owned evidence and exact identity
        run: |
          set -euo pipefail
          mkdir -p build_output/issue4/precons
          { git rev-parse HEAD; xcodebuild -version; swift --version; } > build_output/issue4/source-environment.txt
      - name: Execute portable native protocol tests on macOS
        run: swift test --package-path packages/ondevice-engine/swift --jobs 2 2>&1 | tee build_output/issue4/swift-protocol.log
      - name: Execute portable app tests and export exact bundled decks
        env:
          MAGICMOBILE_PRECON_EXPORT_DIR: ${{ github.workspace }}/build_output/issue4/precons
        run: swift test --package-path apps/ios --jobs 2 2>&1 | tee build_output/issue4/swift-presentation.log
      - name: Bind exported precons to this exact source
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('build_output/issue4/precons')
          names = {'token-triumph.json', 'first-flight.json', 'grave-danger.json', 'chaos-incarnate.json', 'draconic-destruction.json'}
          assert {p.name for p in directory.iterdir()} == names
          files = {name: hashlib.sha256((directory/name).read_bytes()).hexdigest() for name in sorted(names)}
          (directory/'provenance.json').write_text(json.dumps({'sourceCommit': os.environ['GITHUB_SHA'], 'files': files}, indent=2)+'\n')
          PY
      - name: Native-close fixture tests (not XMage runtime)
        run: bash packages/ondevice-engine/scripts/test_swift_close.sh
      - name: Compile Debug product and SDK-only tests without signing or execution
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml
          xcodebuild -project apps/ios/MagicMobileiOS.xcodeproj -scheme MagicMobile \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/issue4-sdk" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build-for-testing 2>&1 | tee build_output/issue4/unsigned-sdk-build.log
      - name: Compile fail-closed unlinked Release product without signing or execution
        run: |
          set -euo pipefail
          xcodebuild -project apps/ios/MagicMobileiOS.xcodeproj -scheme MagicMobile \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/issue4-sdk" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee build_output/issue4/unsigned-release-build.log
          echo 'Compiled app and SDK tests only. No simulator, native XMage linkage, signing or execution.' > build_output/issue4/SDK-SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue4-apple-${{ github.sha }}
          path: build_output/issue4/
          retention-days: 7
          if-no-files-found: error

  real-jvm:
    needs: apple-source-and-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/ondevice-engine
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: issue4-apple-${{ github.sha }}
          path: build_output/issue4-apple
      - name: Verify exact Swift export provenance before JVM validation
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('../../build_output/issue4-apple/precons')
          manifest = json.loads((directory/'provenance.json').read_text())
          expected = {'token-triumph.json', 'first-flight.json', 'grave-danger.json', 'chaos-incarnate.json', 'draconic-destruction.json'}
          assert manifest['sourceCommit'] == os.environ['GITHUB_SHA']
          assert set(manifest['files']) == expected
          assert {p.name for p in directory.iterdir()} == expected | {'provenance.json'}
          for name, digest in manifest['files'].items():
              assert hashlib.sha256((directory/name).read_bytes()).hexdigest() == digest, name
          print('Verified exact-source Swift exports; gameplay validation follows.')
          PY
      - run: mkdir -p evidence; bash scripts/build_jvm.sh 2>&1 | tee evidence/issue4-jvm-build.log
      - run: bash scripts/test_real_engine.sh 2>&1 | tee evidence/issue4-real-engine.log
      - name: Exercise all five bundled Swift-resolved precons through real XMage
        run: python3 scripts/test_ios_precons.py ../../build_output/issue4-apple/precons 2>&1 | tee evidence/issue4-real-swift-precons.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue4-real-jvm-${{ github.sha }}
          path: |
            packages/ondevice-engine/evidence/
            packages/ondevice-engine/build/generated/registry-report.json
          retention-days: 7
          if-no-files-found: error

# Standard public-repository runners only. Never invokes simctl, xcodebuild
# test/test-without-building, signing, distribution, or a remote gameplay engine.
# JVM games, C fixtures, compiler layout tests, and SDK compilation remain distinct.
