name: Web engine (GraalVM Web Image)
# The real XMage adapter compiled to WebAssembly for desktop browsers (docs/WEB_ENGINE_M1.md). It runs free on
# GitHub's 16 GB runner, by default on all-open-source tools: GraalVM Community Edition (GPLv2 with the Classpath
# Exception) and the Web Image tool built from oracle/graal at CE's commit with the builder fixes in its source
# (packages/web-engine/ce/build_web_image_tool.sh), which fit a 12 GB heap with no swap.
# Oracle GraalVM, whose licence (GFTC) allows use unmodified, stays selectable: [oracle] in the commit's subject line
# (or dispatch toolchain=oracle) builds with its stock builder over 16 GB of swap; [builder-patch] patches its builder
# at build time, an experiment whose bundle is not for players ("The licence question" in the doc). Tags count only in
# the subject line, so a message body can mention them.
#
# Rebuilds on its own when engine inputs change on main, but skips inputs it has already built (the plan job's key);
# on claude/web-engine-* branches when the commit message has [web-image]; or by hand. Ships nothing to players: the
# bundle artifact (engine-<hash>.js and .wasm, decks, manifest.json) is what a web host serves (M3).
on:
  push:
    branches: [main, 'claude/web-engine-*']
    # The engine's inputs; keep in step with the plan job's key.
    paths:
      - 'packages/ondevice-engine/engine/**'
      - 'packages/ondevice-engine/platform/**'
      - 'packages/ondevice-engine/native/**'
      - 'packages/ondevice-engine/scripts/**'
      - 'packages/ondevice-engine/upstream.lock.json'
      - 'packages/web-engine/**'
      - '.github/workflows/magicmobile-web-image.yml'
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'ce (GraalVM CE + Web Image built from source, the default) or oracle (Oracle GraalVM over swap)'
        type: choice
        options: ['ce', 'oracle']
        default: 'ce'
      builder_patch:
        description: 'Experiment, Oracle only: patch its builder (12 GB, no swap); the bundle is not for players'
        type: boolean
        default: false
      force:
        description: 'Build even if a bundle for these inputs already exists'
        type: boolean
        default: false
      phone_regressions:
        description: 'Also run the phone real-engine regressions (test_real_engine.sh, about 10 minutes)'
        type: boolean
        default: false
      builder_heap:
        description: 'Override the builder heap (-Xmx), e.g. 13g'
        type: string
        default: ''
      swap_gb:
        description: 'Add a swap file on /mnt of this many GB (0: none; Oracle stock always gets 16)'
        type: string
        default: '0'
      diagnostics:
        description: 'Builder heap histograms (builder_watch.sh) and native memory tracking; slows the build'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false
env:
  CE_VERSION: '25.4.4.1.1'
  CE_ARCHIVE: graalvm-community-jdk-25i4-25.0.4.1.1_linux-x64_bin.tar.gz
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[web-image]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
      toolchain: ${{ steps.key.outputs.toolchain }}
      patch: ${{ steps.key.outputs.patch }}
      phone: ${{ steps.key.outputs.phone }}
      bundle: ${{ steps.key.outputs.bundle }}
      build: ${{ steps.key.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: key
        name: Key the build by its inputs and toolchain; skip what already has a bundle
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          TOOLCHAIN: ${{ inputs.toolchain || 'ce' }}
          PATCH_INPUT: ${{ inputs.builder_patch }}
          PHONE_INPUT: ${{ inputs.phone_regressions }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Git's hash of each input tree (the on.push.paths list; this file names the toolchain versions).
          key=$(for p in packages/ondevice-engine/engine packages/ondevice-engine/platform packages/ondevice-engine/native \
                         packages/ondevice-engine/scripts packages/ondevice-engine/upstream.lock.json packages/web-engine \
                         .github/workflows/magicmobile-web-image.yml; do echo "$p $(git rev-parse "HEAD:$p")"; done |
                sha256sum | cut -c1-16)
          subject=${MESSAGE%%$'\n'*} patch=false phone=false
          if [[ $subject == *'[oracle]'* ]]; then TOOLCHAIN=oracle; fi
          if [[ $PATCH_INPUT == true || $subject == *'[builder-patch]'* ]]; then TOOLCHAIN=oracle patch=true; fi
          if [[ $PHONE_INPUT == true || $subject == *'[phone-regressions]'* ]]; then phone=true; fi
          # Each toolchain gets its own bundle name; a patched-builder experiment can never stand in for another.
          bundle=web-engine-bundle-$key
          if [[ $TOOLCHAIN == oracle ]]; then bundle=$bundle-oracle; fi
          if [[ $patch == true ]]; then bundle=$bundle-patched; fi
          { echo "key=$key"; echo "toolchain=$TOOLCHAIN"; echo "patch=$patch"; echo "phone=$phone"; echo "bundle=$bundle"; } | tee -a "$GITHUB_OUTPUT"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$bundle" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if [[ $FORCE == true || $existing == 0 ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$bundle already exists for these inputs; not rebuilding (dispatch with force to rebuild)"
          fi
  web-image:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      MM_WEB_BUILD_KEY: ${{ needs.plan.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Third-party Maven downloads only: the XMage modules (org/mage) are rebuilt from the pinned source every run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/mage
          key: web-image-maven-${{ runner.os }}-${{ hashFiles('packages/ondevice-engine/upstream.lock.json') }}
          restore-keys: web-image-maven-${{ runner.os }}-
      - name: Build the real XMage JVM input (pinned upstream, adapter, registry, card resources)
        run: bash packages/ondevice-engine/scripts/build_jvm.sh
      # Dispatch needs the workflow on the default branch; until then a push opts in with [phone-regressions].
      - name: Phone real-engine regressions (unchanged by the web build)
        if: needs.plan.outputs.phone == 'true'
        run: bash packages/ondevice-engine/scripts/test_real_engine.sh
      - name: GraalVM CE, pinned and checksummed
        if: needs.plan.outputs.toolchain == 'ce'
        run: |
          set -euo pipefail
          U="https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-$CE_VERSION/$CE_ARCHIVE"
          curl -sSfL -o "$RUNNER_TEMP/$CE_ARCHIVE" "$U" && curl -sSfL -o "$RUNNER_TEMP/$CE_ARCHIVE.sha256" "$U.sha256"
          echo "$(tr -d ' \n' < "$RUNNER_TEMP/$CE_ARCHIVE.sha256")  $RUNNER_TEMP/$CE_ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/graalvm-ce" && tar xzf "$RUNNER_TEMP/$CE_ARCHIVE" -C "$RUNNER_TEMP/graalvm-ce" --strip-components 1
          rm "$RUNNER_TEMP/$CE_ARCHIVE"
          echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm-ce" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/graalvm-ce/bin" >> "$GITHUB_PATH"
      # The Web Image tool, built from oracle/graal with the builder fixes, only changes with them or with CE.
      - id: tool-cache
        if: needs.plan.outputs.toolchain == 'ce'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/graalvm-ce/lib/svm/tools/svm-wasm
          key: web-image-ce-tool-${{ env.CE_VERSION }}-${{ hashFiles('packages/web-engine/builder-patch/src/**', 'packages/web-engine/builder-patch/rebase.sh', 'packages/web-engine/ce/build_web_image_tool.sh') }}
      - name: Build the Web Image tool from oracle/graal into CE (cache miss)
        if: needs.plan.outputs.toolchain == 'ce' && steps.tool-cache.outputs.cache-hit != 'true'
        run: bash packages/web-engine/ce/build_web_image_tool.sh "$GRAALVM_HOME" "$RUNNER_TEMP/ce-tool"
      - uses: graalvm/setup-graalvm@v1
        if: needs.plan.outputs.toolchain == 'oracle'
        with:
          version: '25.4'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'false'
      - name: Install binaryen (wasm-as), pinned and checksummed
        run: |
          set -euo pipefail
          V=version_133
          SUM=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
          curl -sSfL -o "$RUNNER_TEMP/binaryen.tar.gz" "https://github.com/WebAssembly/binaryen/releases/download/$V/binaryen-$V-x86_64-linux.tar.gz"
          echo "$SUM  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$V/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchain smoke test (a probe program prints the same in Wasm as on the JVM)
        run: |
          set -euo pipefail
          native-image --version
          probe="$RUNNER_TEMP/probe"; mkdir -p "$probe/out"
          "$GRAALVM_HOME/bin/javac" -d "$probe/classes" packages/web-engine/ce/probe/Probe.java
          jvm=$("$GRAALVM_HOME/bin/java" -cp "$probe/classes" Probe)
          native-image --tool:svm-wasm -J-Xmx3g -H:+UnlockExperimentalVMOptions -H:WasmComments=NONE -H:-ClosureCompiler \
            -H:ReflectionConfigurationFiles=packages/web-engine/ce/probe/reflect-config.json -cp "$probe/classes" \
            -o "$probe/out/probe" Probe > "$probe/build.log" 2>&1 || { cat "$probe/build.log"; exit 1; }
          wasm=$(node "$probe/out/probe.js" | tail -1)
          echo "JVM:  $jvm"; echo "Wasm: $wasm"
          [[ "$jvm" == "$wasm" ]]
      - name: Web sources, JVM compile and the web mode's own game check (no engine thread may start)
        env:
          JAVA_HOME: ${{ env.GRAALVM_HOME }}
        run: |
          set -euo pipefail
          wasm-as --version
          bash packages/web-engine/build_web.sh sources
          bash packages/web-engine/build_web.sh jvm
          python3 packages/web-engine/export_precons.py --catalogue packages/ondevice-engine/build/generated/catalogue.jsonl \
            --swift apps/ios/MagicMobile/PreconCatalog.swift --output packages/web-engine/build/decks
          # Two games in the web threading mode on GraalVM's JVM, recording native-image reachability metadata
          # (reflection, resources, proxies) the static exporter may miss.
          mkdir -p packages/web-engine/build/agent
          node apps/web-play/scripts/jvm-baseline.mjs --web --games 2p:1,4p:2 --cap 600 \
            --agent "$PWD/packages/web-engine/build/agent" --out packages/web-engine/build/metrics/ci-jvm-web.json
          bash packages/web-engine/build_web.sh metadata
      # The settings, and each run that led to them, are in docs/WEB_ENGINE_M1.md ("Fitting the free runner").
      - name: Choose the build settings
        env:
          TOOLCHAIN: ${{ needs.plan.outputs.toolchain }}
          PATCH: ${{ needs.plan.outputs.patch }}
          HEAP_OVERRIDE: ${{ inputs.builder_heap }}
          SWAP_GB: ${{ inputs.swap_gb || '0' }}
        run: |
          set -euo pipefail
          if [[ $TOOLCHAIN == ce ]]; then
            echo "GraalVM CE with the Web Image tool built from source, builder fixes in it (the default)"
            fixes=builtin heap=${HEAP_OVERRIDE:-12g} gc=g1 swap=$SWAP_GB
          elif [[ $PATCH != true ]]; then
            echo "Oracle GraalVM's builder, unmodified, over swap"
            fixes=none heap=${HEAP_OVERRIDE:-24g} gc=parallel swap=16
          elif bash packages/web-engine/builder-patch/build_patch.sh --check; then
            echo "::warning::Experiment: Oracle GraalVM's builder patched. This bundle is not for players (docs/WEB_ENGINE_M1.md, \"The licence question\")."
            fixes=patch heap=${HEAP_OVERRIDE:-12g} gc=g1 swap=$SWAP_GB
          else
            echo "::error::The builder patch does not match this GraalVM; move it with packages/web-engine/builder-patch/rebase.sh."
            exit 1
          fi
          { echo "MM_WEB_BUILDER_FIXES=$fixes"; echo "MM_WEB_HEAP=$heap"; echo "MM_WEB_GC=$gc"; echo "MM_WEB_SWAP_GB=$swap"; } | tee -a "$GITHUB_ENV"
      - name: Add swap on /mnt
        if: env.MM_WEB_SWAP_GB != '0'
        run: |
          set -euo pipefail
          sudo fallocate -l "${MM_WEB_SWAP_GB}G" /mnt/web-image.swap
          sudo chmod 600 /mnt/web-image.swap
          sudo mkswap /mnt/web-image.swap
          sudo swapon /mnt/web-image.swap
          free -g
      - name: Web Image build (native-image --tool:svm-wasm, -O2)
        timeout-minutes: 270
        env:
          DIAGNOSTICS: ${{ inputs.diagnostics }}
          MM_WEB_BUILDER_THREADS: '2'
          MM_WEB_OPT: '2'
          MM_WEB_EXTRA_OPTIONS: >-
            -H:DeadlockWatchdogInterval=0
            -H:BuildOutputJSONFile=packages/web-engine/build/wasm-build-output.json
            -J-Xlog:gc:file=packages/web-engine/build/builder-gc.log:time,uptime:filecount=2,filesize=8M
        run: |
          set -euo pipefail
          ( while true; do sleep 60; echo "[mem] $(date -u +%T) $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"} /Swap:/{print "swap="$3"MB"}' | tr '\n' ' ')"; done ) &
          if [[ $DIAGNOSTICS == true ]]; then
            export MM_WEB_EXTRA_OPTIONS="$MM_WEB_EXTRA_OPTIONS -J-XX:NativeMemoryTracking=summary"
            bash packages/web-engine/builder_watch.sh packages/web-engine/build/wasm/native-image.log packages/web-engine/build/watch &
          fi
          /usr/bin/time -v bash packages/web-engine/build_web.sh wasm 2> >(tee packages/web-engine/build/wasm-time.txt >&2)
          bash packages/web-engine/build_web.sh bundle
          ls -la packages/web-engine/build/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ needs.plan.outputs.bundle }}-evidence-${{ github.run_attempt }}
          path: |
            packages/web-engine/build/wasm/native-image.log
            packages/web-engine/build/wasm-time*.txt
            packages/web-engine/build/wasm/wasm-as-time.txt
            packages/web-engine/build/wasm-build-output.json
            packages/web-engine/build/builder-gc.log*
            packages/web-engine/build/watch/
            packages/web-engine/build/metrics/
            packages/web-engine/build/agent/
            packages/web-engine/build/web-src/web-sources.json
            packages/web-engine/build/web/manifest.json
            packages/ondevice-engine/evidence/
          retention-days: 30
          if-no-files-found: warn
      # Named by the inputs' key: the plan job of a later run finds it and skips the rebuild while it is unexpired.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ needs.plan.outputs.bundle }}
          path: packages/web-engine/build/web/
          compression-level: 6
          retention-days: 90
          if-no-files-found: error
