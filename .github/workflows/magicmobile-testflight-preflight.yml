name: TestFlight repository preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-repository-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Existing gateway regression checks
        run: pnpm --filter @magicmobile/xmage-gateway test
      - name: Repository typecheck
        run: pnpm typecheck
      - name: Compile existing bridge image without running or publishing it
        run: docker build -t magicmobile-xmage-bridge-check apps/xmage-gateway/bridge
# This verifies retained repository components only. It never signs/uploads an
# app, runs a game server, or establishes native iOS or on-device gameplay proof.
