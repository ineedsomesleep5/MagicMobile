name: TestFlight repository preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-repository-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release tooling preflight
        run: python3 scripts/release/preflight.py run --profile tooling
      - name: TestFlight version guard and group distribution regressions
        run: python3 -m unittest discover -s scripts/ios -p 'test_*.py'
      - name: Build-number script syntax
        # Its behavior tests need macOS PlistBuddy and run in the Issue 4 workflow.
        run: node --check scripts/ios/testflight-build-number.mjs
# This verifies retained repository release tooling only. It never signs/uploads an
# app, runs a game server, or establishes native iOS or on-device gameplay proof.
