name: Android app checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'scripts/android/**'
      - 'packages/ondevice-engine/**'
      - 'apps/ios/MagicMobile/Resources/ondevice-catalogue.json'
      - 'apps/ios/MagicMobile/PreconCatalog.swift'
      - 'apps/ios/MagicMobile/Assets.xcassets/**'
      - '.github/workflows/magicmobile-android-app.yml'
  pull_request:
    # Runs on every PR (main requires the check); `changes` skips the job unless these shared sources changed:
    # the diagnostic APK regenerates Android assets from them. This job compiles and checks contracts, but does not
    # execute XMage or an Android device; the full-native workflow remains a separate evidence gate.
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  # Every PR gets this workflow's checks, because main requires them for auto-merge. A PR that touches none of
  # these paths skips the jobs below, and GitHub counts a skipped job as passing.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          # The files list stops at 3,000; a PR that big runs everything.
          if [ "$(wc -l < changed.txt)" -ge 3000 ] || grep -qE '^(apps/android/|scripts/android/|packages/ondevice-engine/|apps/ios/MagicMobile/Resources/ondevice-catalogue\.json$|apps/ios/MagicMobile/PreconCatalog\.swift$|apps/ios/MagicMobile/Assets\.xcassets/(mana-[^/]*\.imageset|AppIcon\.appiconset)/|\.github/workflows/magicmobile-android-app\.yml$)' changed.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
  app:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle comes from the wrapper (apps/android/gradlew, pinned with a checksum).
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'"
      - name: Compile app and exercise Kotlin contracts against captured XMage views
        run: |
          set -euo pipefail
          mkdir -p build_output/android-app
          apps/android/gradlew -p apps/android --no-daemon :core:contractChecks :core:deckStudioChecks :core:providerChecks :core:insightChecks :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug 2>&1 | tee build_output/android-app/build.log
          git rev-parse HEAD > build_output/android-app/source.txt
          echo 'Diagnostic compilation: no native engine, no Android device execution.' > build_output/android-app/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-app-checks-${{ github.sha }}
          path: |
            build_output/android-app/
            apps/android/app/build/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-DIAGNOSTIC-NO-ENGINE-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          # A compile check, never installed: keep it one day, not a week of storage per push.
          retention-days: 1
          if-no-files-found: error
