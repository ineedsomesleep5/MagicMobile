name: Android app checks
on:
  pull_request:
    paths: ['apps/android/**', 'scripts/android/**', '.github/workflows/magicmobile-android-app.yml', 'packages/ondevice-engine/engine/core/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'"
      - name: Compile app and exercise Kotlin contracts against captured XMage views
        run: |
          set -euo pipefail
          mkdir -p build_output/android-app
          gradle -p apps/android --no-daemon :core:contractChecks :app:assembleDebug :app:lintDebug 2>&1 | tee build_output/android-app/build.log
          git rev-parse HEAD > build_output/android-app/source.txt
          echo 'Diagnostic compilation: no native engine, no Android device execution.' > build_output/android-app/SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-app-checks-${{ github.sha }}
          path: |
            build_output/android-app/
            apps/android/app/build/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-DIAGNOSTIC-NO-ENGINE-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
