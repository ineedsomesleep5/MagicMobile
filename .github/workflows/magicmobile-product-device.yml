name: Issue 4 real engine unsigned product
on:
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: 'Exact successful full ARM64 workflow run ID'
        required: true
        type: string
      engine_commit:
        description: 'Exact 40-character engine source SHA from that run'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: issue4-product-${{ github.sha }}-${{ inputs.engine_commit }}
  cancel-in-progress: false
# The selected repair build must SUCCEED before its artifact is accepted. This
# workflow waits for that exact run; it does not duplicate the native build or
# substitute an older archive. Reuse requires equal engine/compiler inputs.
env:
  ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
  ENGINE_COMMIT: ${{ inputs.engine_commit }}
jobs:
  exact-native-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 215
    outputs:
      artifact_id: ${{ steps.native.outputs.artifact_id }}
      artifact_digest: ${{ steps.native.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful exact-source full engine build
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 packages/ondevice-engine/scripts/wait_issue4_native.py
          --run-id "$ENGINE_RUN_ID" --commit "$ENGINE_COMMIT"
          --timeout 12600
          --output "$RUNNER_TEMP/native-run.json"
      - uses: actions/upload-artifact@v4
        with:
          name: issue4-native-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/native-run.json
          if-no-files-found: error
  unsigned-product:
    needs: exact-native-artifact
    runs-on: macos-26-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch exact successful engine artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.exact-native-artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.exact-native-artifact.outputs.artifact_digest }}
        run: >-
          python3 packages/ondevice-engine/scripts/download_issue4_native.py
          --artifact-id "$ARTIFACT_ID" --digest "$ARTIFACT_DIGEST"
          --destination "$RUNNER_TEMP/native-candidate"
      - name: Verify matching engine and application source inputs
        env:
          ARTIFACT_ID: ${{ needs.exact-native-artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.exact-native-artifact.outputs.artifact_digest }}
        run: >-
          python3 packages/ondevice-engine/scripts/verify_native_candidate.py
          --directory "$RUNNER_TEMP/native-candidate" --engine-commit "$ENGINE_COMMIT"
          --run-id "$ENGINE_RUN_ID" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
          --output packages/ondevice-engine/build/native-candidate-provenance.json
      - name: Stage only verified native inputs in the existing product
        run: |
          set -euo pipefail
          python3 packages/ondevice-engine/scripts/prepare_ios_app_native.py \
            --archive "$RUNNER_TEMP/native-candidate/libmmengine.a" \
            --header "$RUNNER_TEMP/native-candidate/include/io.magicmobile.nativebridge.ioslibrarymain.h" \
            --clib-dir "$RUNNER_TEMP/native-candidate/clib" \
            --jdk-lib-dir "$RUNNER_TEMP/native-candidate/jdk" --apply
      - name: Verify native release source guard against the actual paired artifact
        run: >-
          python3 scripts/ios/testflight_native_guard.py source
          --repo "$GITHUB_WORKSPACE" --export-options release/testflight/ExportOptions.plist
          --output packages/ondevice-engine/evidence/issue4-release-source.json
      - name: Compile and link actual Release product without signing
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          bash packages/ondevice-engine/scripts/build_issue4_unsigned_app.sh
      - name: Inspect actual native Release upload settings without signing
        run: |
          set -euo pipefail
          xcodebuild -project apps/ios/MagicMobileiOS.xcodeproj -scheme MagicMobile \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -showBuildSettings -json > packages/ondevice-engine/evidence/issue4-release-settings.json
          python3 - <<'PYCODE'
          import json, pathlib, plistlib, sys
          sys.path.insert(0, 'scripts/ios')
          from testflight_native_guard import inspect_settings, export_policy, unchanged_inputs
          root = pathlib.Path.cwd()
          evidence = root / 'packages/ondevice-engine/evidence'
          identity = inspect_settings(json.loads((evidence/'issue4-release-settings.json').read_text()))
          export_policy(plistlib.loads((root/'release/testflight/ExportOptions.plist').read_bytes()))
          unchanged_inputs(root, json.loads((evidence/'issue4-release-source.json').read_text()))
          print(json.dumps({**identity, 'scope': 'Actual Release configuration only; no signing, upload or phone execution'}))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue4-product-link-evidence-${{ github.sha }}
          path: |
            packages/ondevice-engine/evidence/
            packages/ondevice-engine/build/native-candidate-provenance.json
            packages/ondevice-engine/build/issue4-device-link.*/settings.json
            packages/ondevice-engine/build/issue4-device-link.*/product-receipt.json
            apps/ios/NativeEngine/manifest.json
          if-no-files-found: error
          retention-days: 14
# No simulator, signing, distribution, TestFlight upload, or runtime claim.
