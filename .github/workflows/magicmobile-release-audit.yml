name: Integrate reviewed release audit source
on:
  push:
    branches: [codex/issue-4-release-audit]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'ineedsomesleep5/MagicMobile' && github.ref == 'refs/heads/codex/issue-4-release-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hash-pinned reviewed fixes on the isolated audit branch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          parts = [pathlib.Path(f'.github/release-audit-parts/{i}.patch') for i in range(8)]
          payload = b''.join(path.read_bytes() for path in parts)
          expected = 'e21ee2d0225225a5015ea64fdb5985f1114eb99ed4da4ce818e46ac591236503'
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit('Reviewed patch checksum mismatch')
          base = 'c85c54517fd08f7a97ec0d796edbd1df6f90070e'
          changed = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          if changed != {str(path) for path in parts} | {'.github/workflows/magicmobile-release-audit.yml'}:
              raise SystemExit('Unexpected audit branch changes; refusing to overwrite')
          pathlib.Path('/tmp/reviewed-audit.patch').write_bytes(payload)
          PY
          git apply --check --index --exclude=.github/workflows/magicmobile-release-audit.yml /tmp/reviewed-audit.patch
          git apply --index --exclude=.github/workflows/magicmobile-release-audit.yml /tmp/reviewed-audit.patch
          git rm -r .github/release-audit-parts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix session recovery, mana binding, native diagnostics and Swift compiler expressions'
          git push origin HEAD:refs/heads/codex/issue-4-release-audit
          git rev-parse HEAD
# One-time source integration only. No signing, distribution, or native acceptance.
