name: Workflow tooling safety

on:
  pull_request:
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/workflow-metrics.py'
      - 'scripts/test_workflow_metrics.py'
      - 'scripts/deck-studio/ios-ui-tests.py'
      - 'scripts/deck-studio/test_ios_ui_tests.py'
      - 'scripts/ios/deploy-testflight.sh'
      - 'scripts/ios/distribute-testflight-groups.sh'
      - 'packages/ondevice-engine/scripts/verify_native_candidate.py'
      - '.github/workflows/magicmobile-workflow-tools.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/workflow-metrics.py'
      - 'scripts/test_workflow_metrics.py'
      - 'scripts/deck-studio/ios-ui-tests.py'
      - 'scripts/deck-studio/test_ios_ui_tests.py'
      - 'scripts/ios/deploy-testflight.sh'
      - 'scripts/ios/distribute-testflight-groups.sh'
      - 'packages/ondevice-engine/scripts/verify_native_candidate.py'
      - '.github/workflows/magicmobile-workflow-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test evidence reuse and release recovery without external mutations
        run: python3 scripts/release/preflight.py run --profile tooling
      - name: Preserve preflight results and original logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-preflight-${{ github.run_id }}
          path: build_output/preflight/
          retention-days: 7
          if-no-files-found: warn
