name: Workflow tooling safety

on:
  pull_request:
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/workflow-metrics.py'
      - 'scripts/test_workflow_metrics.py'
      - 'scripts/deck-studio/ios-ui-tests.py'
      - 'scripts/deck-studio/test_ios_ui_tests.py'
      - 'scripts/ios/deploy-testflight.sh'
      - 'packages/ondevice-engine/scripts/verify_native_candidate.py'
      - '.github/workflows/magicmobile-workflow-tools.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/workflow-metrics.py'
      - 'scripts/test_workflow_metrics.py'
      - 'scripts/deck-studio/ios-ui-tests.py'
      - 'scripts/deck-studio/test_ios_ui_tests.py'
      - 'scripts/ios/deploy-testflight.sh'
      - 'packages/ondevice-engine/scripts/verify_native_candidate.py'
      - '.github/workflows/magicmobile-workflow-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test evidence reuse and release recovery without external mutations
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_workflow_metrics.py' -v
          python3 -m unittest discover -s scripts/deck-studio -p 'test_ios_ui_tests.py' -v
      - name: Check release shell syntax
        run: bash -n scripts/ios/deploy-testflight.sh scripts/ios/distribute-testflight-groups.sh
