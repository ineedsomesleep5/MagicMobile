name: On-device engine gates
on:
  pull_request:
    paths: ['packages/ondevice-engine/**', 'apps/ios-ondevice/**', '.github/workflows/magicmobile-ondevice.yml']
  push:
    branches: [main]
    paths: ['packages/ondevice-engine/**', 'apps/ios-ondevice/**', '.github/workflows/magicmobile-ondevice.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ondevice-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/test_tooling.sh
      - run: bash scripts/test_native_boundary.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-test-evidence
          path: packages/ondevice-engine/evidence
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path packages/ondevice-engine/swift
      - run: bash packages/ondevice-engine/scripts/test_swift_close.sh
      - run: command -v xcodegen || brew install xcodegen
      - run: bash packages/ondevice-engine/scripts/test_ios_harness.sh
  real-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/ondevice-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/build_jvm.sh
      - run: bash scripts/test_real_engine.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-jvm-engine-evidence
          path: packages/ondevice-engine/evidence
  upstream-report:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 packages/ondevice-engine/scripts/check_upstream.py
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-movement-report
          path: packages/ondevice-engine/evidence/upstream-status.json
# The real JVM build/regressions now have local passing evidence and their own gate.
# Native/device gates remain unproven. CI green does NOT imply iOS gameplay works.
